<!-- src/app/pages/order-list/order-list.html -->
<div class="max-w-4xl mx-auto px-4 mt-8 space-y-6 pb-24">

    <!-- Título -->
    <div class="mb-6">
        <span class="text-[#944a00] font-bold tracking-widest text-xs uppercase mb-2 block">Gestión de Ventas</span>
        <h1 class="text-4xl font-extrabold tracking-tight text-[#1b1c1c] leading-none">Pedidos</h1>
        <div class="h-1 w-24 bg-[#fb923c] mt-4"></div>
    </div>

    <!-- Botón nuevo pedido -->
    <button (click)="goToNewOrder()"
        class="w-full flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-[#944a00] to-[#fb923c] text-white rounded-xl font-bold text-sm shadow-lg shadow-orange-500/20 hover:brightness-110 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-sm">add</span>
        NUEVO PEDIDO
    </button>

    <!-- Loading -->
    @if (loading()) {
        <div class="flex justify-center py-16">
            <div class="w-8 h-8 border-4 border-[#fb923c] border-t-transparent rounded-full animate-spin"></div>
        </div>
    }

    <!-- Error -->
    @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm p-4 rounded-xl">
            {{ error() }}
        </div>
    }

    @if (!loading()) {

        <!-- Sin pedidos -->
        @if (orders().length === 0) {
            <div class="text-center py-16 text-slate-400">
                <span class="material-symbols-outlined text-5xl block mb-2">receipt_long</span>
                <p class="text-sm">No hay pedidos activos</p>
            </div>
        }

        <!-- Lista unificada de todos los pedidos -->
        @if (orders().length > 0) {
            <section class="space-y-3">
                <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400">
                    Pedidos activos · {{ orders().length }}
                </h2>
                @for (order of orders(); track order.orderno) {
                    <ng-container *ngTemplateOutlet="orderCard; context: { $implicit: order, role: getOrderRole(order) }"/>
                }
            </section>
        }
    }
</div>

<!-- Template de tarjeta de pedido -->
<ng-template #orderCard let-order let-role="role">
    <button (click)="goToDetail(order.orderno)"
        class="w-full text-left bg-white border-2 border-[#dbc1b2]/30 rounded-xl overflow-hidden hover:shadow-md active:scale-[0.99] transition-all"
        [class.border-[#dbc1b2]]="role !== 'viewer'"
        [class.hover:border-[#944a00]/30]="role !== 'viewer'"
        [class.border-slate-200/60]="role === 'viewer'"
        >

        <!-- Franja shipper -->
        @if (order.shippername) {
            <div class="bg-[#0f7a0f] text-white text-[10px] font-black uppercase tracking-widest px-4 py-1.5 flex items-center gap-1.5">
                <span class="material-symbols-outlined text-sm">local_shipping</span>
                {{ order.shippername }}
            </div>
        }

        <div class="p-4" [class.opacity-70]="role === 'viewer'">

        <!-- Fila superior: número + estado -->
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] font-mono font-bold text-[#944a00] bg-orange-50 px-2 py-0.5 rounded">
                    #{{ order.orderno }}
                </span>
                <!-- Badge de rol -->
                @switch (role) {
                    @case ('seller') {
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">
                            Mi venta
                        </span>
                    }
                    @case ('dispatch') {
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">
                            Para despachar
                        </span>
                    }
                    @case ('both') {
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-100 text-violet-700">
                            Venta directa
                        </span>
                    }
                    @case ('viewer') {
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
                            Otro almacén
                        </span>
                    }
                }
            </div>

            <!-- Badge de estado -->
            @if (getOrderStatus(order); as status) {
                <span class="text-[10px] font-bold px-2 py-1 rounded-full flex-shrink-0"
                    [class.bg-green-100]="status.color === 'green'"
                    [class.text-green-700]="status.color === 'green'"
                    [class.bg-blue-100]="status.color === 'blue'"
                    [class.text-blue-700]="status.color === 'blue'"
                    [class.bg-amber-100]="status.color === 'amber'"
                    [class.text-amber-700]="status.color === 'amber'"
                    [class.bg-slate-100]="status.color === 'slate'"
                    [class.text-slate-500]="status.color === 'slate'">
                    {{ status.label }}
                </span>
            }
        </div>

        <!-- Cliente y fecha -->
        <p class="font-bold text-[#1b1c1c] text-sm">{{ order.customername }}</p>
        <p class="text-xs text-slate-400 mb-3">{{ formatDate(order.orddate) }}</p>

        <!-- Fila inferior: almacenes + picking + total -->
        <div class="flex justify-between items-end gap-2">

            <div class="flex flex-col gap-1 text-xs text-slate-500">

                <!-- Almacén vendedor -->
                <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">storefront</span>
                    <span class="font-medium text-slate-600">Vende:</span>
                    {{ getLocName(order.fromstkloc) }}
                </span>

                <!-- Almacén despachador (solo si difiere) -->
                @if (order.fromstkloc !== order.shiploc) {
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">local_shipping</span>
                        <span class="font-medium text-slate-600">Despacha:</span>
                        {{ getLocName(order.shiploc) }}
                    </span>
                }

                <!-- Picking -->
                <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">inventory_2</span>
                    {{ order.picked_lines }}/{{ order.total_lines }} recogidos
                </span>
            </div>

            <p class="text-base font-black text-[#944a00] flex-shrink-0">
                {{ formatCurrency(order.subtotal) }}
            </p>
        </div>

        <!-- Barra de progreso picking -->
        @if (!order.delivered && order.total_lines > 0) {
            <div class="mt-3 h-1 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-[#fb923c] rounded-full transition-all"
                    [style.width.%]="(order.picked_lines / order.total_lines) * 100">
                </div>
            </div>
        }

        </div><!-- /p-4 -->
    </button>
</ng-template>
