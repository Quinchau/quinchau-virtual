<div class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-md transition-all duration-300">
  
  <div class="w-full max-w-lg bg-white rounded-t-[2rem] sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all animate-in slide-in-from-bottom-10 sm:zoom-in-95 duration-300">
    
    @if (product(); as p) {
      <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          </div>
          <div>
            <h2 class="text-lg font-bold text-gray-800 leading-tight line-clamp-1">{{ p.realname }}</h2>
            <p class="text-xs text-gray-400 font-medium">ID: {{ p.item_id }}</p>
          </div>
        </div>
        <button (click)="backToCart()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-8 space-y-8">
        
        <div class="flex flex-col items-center gap-4">
          <label class="text-sm font-bold text-gray-500 uppercase tracking-widest">Cantidad</label>
          
          <div class="flex items-center gap-8 bg-gray-100 p-2 rounded-2xl border border-gray-200">
            <button 
              (click)="quantity.set(quantity() - 1)"
              [disabled]="isPending() || quantity() <= 1"
              class="w-14 h-14 rounded-xl bg-white shadow-sm flex items-center justify-center hover:bg-gray-50 active:scale-90 transition-all disabled:opacity-30">
              <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            </button>

            <span class="text-4xl font-black text-gray-800 tabular-nums w-12 text-center">
              {{ quantity() }}
            </span>

            <button 
              (click)="quantity.set(quantity() + 1)"
              [disabled]="isPending()"
              class="w-14 h-14 rounded-xl bg-white shadow-sm flex items-center justify-center hover:bg-gray-50 active:scale-90 transition-all">
              <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 bg-blue-50/50 p-4 rounded-2xl border border-blue-100/50">
          <div class="text-center border-r border-blue-100">
            <p class="text-[10px] font-bold text-blue-400 uppercase">Precio Unit.</p>
            <p class="text-xl font-bold text-blue-900">${{ p.price | number:'1.2-2' }}</p>
          </div>
          <div class="text-center">
            <p class="text-[10px] font-bold text-blue-400 uppercase">Total Item</p>
            <p class="text-xl font-bold text-blue-900">${{ tempSubtotal() | number:'1.2-2' }}</p>
          </div>
        </div>
      </div>

      <div class="p-6 bg-gray-50 flex flex-col gap-3">
        <button 
          (click)="onUpdate()"
          [disabled]="isPending() || quantity() === p.quantity"
          class="w-full py-4 bg-gray-900 text-white font-bold rounded-xl shadow-xl shadow-gray-200 hover:bg-black transition-all flex items-center justify-center gap-3 disabled:bg-gray-300 disabled:shadow-none">
          @if (isPending()) {
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            Sincronizando...
          } @else {
            Guardar Cambios
          }
        </button>

        <button 
          (click)="onDelete()"
          [disabled]="isPending()"
          class="w-full py-3 text-red-500 font-bold hover:bg-red-50 rounded-xl transition-colors flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Eliminar del Carrito
        </button>
      </div>
    } @else {
      <div class="p-12 text-center space-y-4">
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <p class="text-gray-500 font-medium">No hay producto seleccionado para editar.</p>
        <button (click)="backToCart()" class="text-blue-600 font-bold">Volver al Checkout</button>
      </div>
    }
  </div>
</div>
