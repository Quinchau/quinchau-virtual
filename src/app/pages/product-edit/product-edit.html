<div class="min-h-screen bg-gray-100 py-6">
  <div class="max-w-2xl mx-auto px-4">
    
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">✏️ Editar Producto</h1>
      <a routerLink="/product-admin" class="text-blue-600 hover:text-blue-800">← Volver</a>
    </div>

    <!-- Loading -->
    <div *ngIf="loadingProduct()" class="bg-white rounded-lg shadow p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
      <p class="mt-2 text-gray-500">Cargando producto...</p>
    </div>

    <!-- Formulario -->
    <form *ngIf="!loadingProduct()" [formGroup]="productForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow p-6 space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Código</label>
        <input type="text" [value]="stockId" disabled class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-gray-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
        <input type="text" formControlName="description" class="w-full border border-gray-300 rounded-lg px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción larga *</label>
        <textarea formControlName="longdescription" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción (ING) *</label>
          <input type="text" formControlName="descriptionUS" class="w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción larga (ING) *</label>
          <textarea formControlName="longdescriptionUS" rows="1" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
          <select formControlName="categoryid" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">Seleccionar...</option>
            <option *ngFor="let cat of categories" [value]="cat.categoryid">{{ cat.categorydescription }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
          <select formControlName="mbflag" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="A">A - Artículo Vendible</option>
            <option value="K">K - Kitset</option>
            <option value="M">M - Materia Prima</option>
            <option value="G">G - Phantom</option>
            <option value="B">B - BOM</option>
            <option value="D">D - Descontinuado</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Unidad *</label>
          <select formControlName="units" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option *ngFor="let unit of units" [value]="unit.unitname">{{ unit.unitname }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Impuesto *</label>
          <select formControlName="taxcatid" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option *ngFor="let tax of taxCategories" [value]="tax.taxcatid">{{ tax.taxcatname }}</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Costo *</label>
          <input type="number" formControlName="costo" class="w-full border border-gray-300 rounded-lg px-3 py-2" step="0.01">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio *</label>
          <input type="number" formControlName="price" class="w-full border border-gray-300 rounded-lg px-3 py-2" step="0.01">
        </div>
      </div>

      <div class="grid grid-cols-4 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">EOQ</label><input type="number" formControlName="eoq" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Volumen</label><input type="number" formControlName="volume" class="w-full border border-gray-300 rounded-lg px-3 py-2" step="0.01"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Kgs</label><input type="number" formControlName="kgs" class="w-full border border-gray-300 rounded-lg px-3 py-2" step="0.01"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Mínimo</label><input type="number" formControlName="minimo" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Código barras</label><input type="text" formControlName="barcode" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Ubicación</label><input type="text" formControlName="location" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
      </div>

      <div class="flex flex-wrap gap-4">
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="discontinued"> Descontinuado</label>
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="controlled"> Controlado</label>
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="serialised"> Serializado</label>
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="perishable"> Perecedero</label>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">URLs Fabricante</label>
        <div formArrayName="fabricante_url">
          <div *ngFor="let url of fabricante_urlArray.controls; let i = index" class="flex gap-2 mb-2">
            <input [formControlName]="i" type="url" class="flex-1 border border-gray-300 rounded-lg px-3 py-2" placeholder="https://...">
            <button type="button" (click)="removeFabricanteUrl(i)" class="bg-red-500 text-white px-3 rounded-lg">✖</button>
          </div>
        </div>
        <button type="button" (click)="addFabricanteUrl()" class="text-blue-600 text-sm">+ Agregar URL</button>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Imágenes</label>
        <app-product-image-uploader
          [stockId]="stockId"
          [initialImages]="images"
          (imagesChanged)="onImagesChanged($event)">
        </app-product-image-uploader>
      </div>

      <div class="flex gap-3 pt-4 border-t">
        <button type="submit" [disabled]="loading() || productForm.invalid" class="bg-blue-500 text-white px-6 py-2 rounded-lg disabled:opacity-50">
          {{ loading() ? 'Guardando...' : '💾 Guardar Cambios' }}
        </button>
        <button type="button" routerLink="/product-admin" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg">Cancelar</button>
      </div>
    </form>
  </div>
</div>
