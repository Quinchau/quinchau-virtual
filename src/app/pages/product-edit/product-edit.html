<div class="min-h-screen bg-gray-100 py-6">
  <div class="max-w-2xl mx-auto px-4">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-medium text-gray-800">Editar producto</h1>
        <span class="text-xs font-mono px-2 py-1 bg-gray-100 border border-gray-200 rounded text-gray-500">{{ stockId }}</span>
      </div>
      <a routerLink="/product-admin" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1">
        ← Volver
      </a>
    </div>

    <!-- Loading -->
    <div *ngIf="loadingProduct()" class="bg-white rounded-xl border border-gray-200 p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
      <p class="mt-2 text-gray-500 text-sm">Cargando producto...</p>
    </div>

    <!-- Formulario -->
    <form *ngIf="!loadingProduct()" [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-2">

      <!-- Descripciones -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('descripcion')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Descripciones
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">4 campos</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['descripcion']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </button>
        <div *ngIf="sections['descripcion']" class="px-4 pb-4 pt-1 border-t border-gray-100 space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Descripción *</label>
            <input type="text" formControlName="description" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Descripción larga *</label>
            <textarea formControlName="longdescription" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Descripción (EN) *</label>
              <input type="text" formControlName="descriptionUS" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Descripción larga (EN) *</label>
              <input type="text" formControlName="longdescriptionUS" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
          </div>
        </div>
      </div>

      <!-- Clasificación -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('clasificacion')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/></svg>
            Clasificación
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">4 campos</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['clasificacion']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </button>
        <div *ngIf="sections['clasificacion']" class="px-4 pb-4 pt-1 border-t border-gray-100 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Categoría *</label>
              <select formControlName="categoryid" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                <option value="">Seleccionar...</option>
                <option *ngFor="let cat of categories" [value]="cat.categoryid">{{ cat.categorydescription }}</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tipo *</label>
              <select formControlName="mbflag" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                <option value="A">A - Artículo Vendible</option>
                <option value="K">K - Kitset</option>
                <option value="M">M - Materia Prima</option>
                <option value="G">G - Phantom</option>
                <option value="B">B - BOM</option>
                <option value="D">D - Descontinuado</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Unidad *</label>
              <select formControlName="units" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                <option *ngFor="let unit of units" [value]="unit.unitname">{{ unit.unitname }}</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Impuesto *</label>
              <select formControlName="taxcatid" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                <option *ngFor="let tax of taxCategories" [value]="tax.taxcatid">{{ tax.taxcatname }}</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Precios -->
<div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
  <button type="button" (click)="toggleSection('precios')"
    class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
    <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Precios y costos
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">4 campos</span>
      <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['precios']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </div>
  </button>
  <div *ngIf="sections['precios']" class="px-4 pb-4 pt-1 border-t border-gray-100 space-y-3">
    <!-- Costo -->
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">Costo *</label>
      <input type="number" formControlName="costo" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    
    <!-- Precio 01 -->
    <div class="flex items-center gap-3">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">
          Precio 01 * 
          <span class="text-gray-400 text-xs">(Regular)</span>
        </label>
        <div class="relative">
          <input type="number" formControlName="price01" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm pr-16">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">+IVA</span>
        </div>
      </div>
      <div class="w-24 text-right">
        <div class="text-xs text-gray-500 mb-1">Margen</div>
        <div class="text-sm font-semibold" [class.text-green-600]="calcularMargen01() >= 0" [class.text-red-500]="calcularMargen01() < 0">
          {{ calcularMargen01() | number:'1.0-0' }}%
        </div>
      </div>
    </div>

    <!-- Precio 02 -->
    <div class="flex items-center gap-3">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">
          Precio 02 * 
          <span class="text-gray-400 text-xs">(Mayorista)</span>
        </label>
        <div class="relative">
          <input type="number" formControlName="price02" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm pr-16">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">+IVA</span>
        </div>
      </div>
      <div class="w-24 text-right">
        <div class="text-xs text-gray-500 mb-1">Margen</div>
        <div class="text-sm font-semibold" [class.text-green-600]="calcularMargen02() >= 0" [class.text-red-500]="calcularMargen02() < 0">
          {{ calcularMargen02() | number:'1.0-0' }}%
        </div>
      </div>
    </div>

    <!-- Precio 03 -->
    <div class="flex items-center gap-3">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">
          Precio 03 * 
          <span class="text-gray-400 text-xs">(Promoción)</span>
        </label>
        <div class="relative">
          <input type="number" formControlName="price03" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm pr-16">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">+IVA</span>
        </div>
      </div>
      <div class="w-24 text-right">
        <div class="text-xs text-gray-500 mb-1">Margen</div>
        <div class="text-sm font-semibold" [class.text-green-600]="calcularMargen03() >= 0" [class.text-red-500]="calcularMargen03() < 0">
          {{ calcularMargen03() | number:'1.0-0' }}%
        </div>
      </div>
    </div>
  </div>
</div>

      <!-- Logística -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('logistica')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Logística
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">6 campos</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['logistica']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </button>
        <div *ngIf="sections['logistica']" class="px-4 pb-4 pt-1 border-t border-gray-100 space-y-3">
          <div class="grid grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">EOQ</label>
              <input type="number" formControlName="eoq" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Volumen</label>
              <input type="number" formControlName="volume" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Kgs</label>
              <input type="number" formControlName="kgs" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Mínimo</label>
              <input type="number" formControlName="minimo" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Código de barras</label>
              <input type="text" formControlName="barcode" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ubicación</label>
              <input type="text" formControlName="location" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
            </div>
          </div>
        </div>
      </div>

      <!-- Estado y control -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('flags')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Estado y control
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">5 flags</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['flags']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </button>
        <div *ngIf="sections['flags']" class="px-4 pb-4 pt-3 border-t border-gray-100">
          <div class="flex flex-wrap gap-6">
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="checkbox" formControlName="discontinued" class="rounded">
              Descontinuado
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="checkbox" formControlName="controlled" class="rounded">
              Controlado
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="checkbox" formControlName="serialised" class="rounded">
              Serializado
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="checkbox" formControlName="perishable" class="rounded">
              Perecedero
            </label>
                  <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input type="checkbox" formControlName="offers" class="rounded">
              En Oferta
            </label>
          </div>
        </div>
      </div>

      <!-- URLs Fabricante -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('fabricante')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            URLs fabricante
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">{{ fabricante_urlArray.length }} URLs</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['fabricante']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </button>
        <div *ngIf="sections['fabricante']" class="px-4 pb-4 pt-1 border-t border-gray-100" formArrayName="fabricante_url">
          <div *ngFor="let url of fabricante_urlArray.controls; let i = index" class="flex gap-2 mb-2">
            <input [formControlName]="i" type="url" placeholder="https://..." class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm">
            <button type="button" (click)="removeFabricanteUrl(i)" class="px-3 py-2 border border-red-200 text-red-500 rounded-lg hover:bg-red-50 text-sm">✕</button>
          </div>
          <button type="button" (click)="addFabricanteUrl()" class="text-blue-600 text-sm hover:text-blue-800">+ Agregar URL</button>
        </div>
      </div>

      <!-- Imágenes -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <button type="button" (click)="toggleSection('imagenes')"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Imágenes
          </div>
          <svg class="w-4 h-4 text-gray-400 transition-transform" [class.rotate-180]="sections['imagenes']" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div *ngIf="sections['imagenes']" class="px-4 pb-4 pt-1 border-t border-gray-100">
          <app-product-image-uploader
            [stockId]="stockId"
            [initialImages]="images"
            (imagesChanged)="onImagesChanged($event)">
          </app-product-image-uploader>
        </div>
      </div>

      <!-- Acciones -->
      <div class="flex gap-3 pt-2 pb-6">
        <button type="submit" [disabled]="loading() || productForm.invalid"
          class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium disabled:opacity-50 transition-colors">
          {{ loading() ? 'Guardando...' : '💾 Guardar cambios' }}
        </button>
        <button type="button" routerLink="/product-admin"
          class="bg-white border border-gray-200 text-gray-600 px-6 py-2 rounded-lg text-sm hover:bg-gray-50 transition-colors">
          Cancelar
        </button>
      </div>

    </form>
  </div>
</div>
