<div class="space-y-4">

  <!-- Zona de carga -->
  <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
    <input type="file"
           #fileInput
           accept="image/jpeg,image/png,image/jpg,image/webp"
           capture="environment"
           (change)="onFileSelected($event)"
           class="hidden">
    <button type="button"
            (click)="fileInput.click()"
            class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition-colors flex items-center justify-center gap-2 mx-auto">
      <span class="text-xl">📷</span>
      Agregar imagen
    </button>
    <p class="text-sm text-gray-500 mt-2">Formatos: JPEG, PNG, JPG, WEBP (Max 5MB)</p>
  </div>

  <!-- Grid de imágenes — solo imagen clickeable, sin botones -->
  <div *ngIf="images.length > 0" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2">
    <div *ngFor="let image of images"
         class="relative aspect-square rounded-lg overflow-hidden ring-2 transition-all"
         [class.ring-yellow-400]="image.cover"
         [class.ring-transparent]="!image.cover"
         [class.cursor-pointer]="image.status === 'done'"
         (click)="onImageClick(image)">

      <img [src]="image.url" class="w-full h-full object-cover" />

      <!-- Badge portada -->
      <span *ngIf="image.cover"
            class="absolute top-1 left-1 bg-yellow-400 text-white text-xs px-1.5 py-0.5 rounded-full leading-none">
        ★
      </span>

      <!-- Subiendo -->
      <div *ngIf="image.status === 'uploading'"
           class="absolute inset-0 bg-black/50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
      </div>

      <!-- Error -->
      <div *ngIf="image.status === 'error'"
           class="absolute inset-0 bg-red-700/80 flex flex-col items-center justify-center gap-1"
           (click)="$event.stopPropagation(); retryUpload(image)">
        <span class="text-white text-xs font-semibold">Error</span>
        <span class="text-white text-xs underline">Reintentar</span>
      </div>
    </div>
  </div>

  <div *ngIf="images.length === 0" class="text-center py-4 text-gray-400 text-sm">
    No hay imágenes
  </div>

  <div *ngIf="images.length > 0" class="text-sm text-gray-500 text-center">
    {{ images.length }} imagen(es)
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL RECORTE 1:1 — aparece antes de subir
════════════════════════════════════════════════════ -->
<div *ngIf="cropVisible"
     class="fixed inset-x-0 bg-black z-50 flex flex-col" style="top: 79px; bottom: 90px;">

  <div class="flex items-center justify-between px-4 py-3 bg-gray-900 border-b border-gray-700">
    <span class="text-white font-semibold">✂️ Recortar imagen</span>
    <button type="button" (click)="cancelCrop()"
            class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
  </div>

  <div class="flex-1 overflow-hidden flex items-center justify-center bg-gray-950">
    <image-cropper
      [imageFile]="pendingFile!"
      [maintainAspectRatio]="true"
      [aspectRatio]="1"
      [resizeToWidth]="1200"
      [onlyScaleDown]="true"
      [roundCropper]="false"
      format="jpeg"
      output="base64"
      (imageCropped)="onImageCropped($event)"
      (imageLoaded)="cropReady = true"
      class="max-h-full"
    />
  </div>

  <p class="text-center text-gray-400 text-xs py-2 bg-gray-900">
    Solo se redimensiona desde las esquinas · Proporción fija 1:1
  </p>

  <div class="flex gap-3 px-4 py-3 bg-gray-900 border-t border-gray-700">
    <button type="button" (click)="cancelCrop()"
            class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-3 rounded-xl font-semibold">
      Cancelar
    </button>
    <button type="button" (click)="confirmCrop()" [disabled]="!cropReady"
            class="flex-1 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white py-3 rounded-xl font-semibold">
      Usar esta imagen
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     EDITOR — abre al hacer click en una imagen ya subida
════════════════════════════════════════════════════ -->
<app-product-image-editor
  *ngIf="editorVisible"
  [stockId]="stockId"
  [imageId]="selectedImageId"
  [imageUrl]="selectedImageUrl"
  [isCover]="selectedImageIsCover"
  [totalImages]="images.length"
  (close)="closeEditor()"
  (imageSaved)="onImageSaved($event)"
  (imageDeleted)="onImageDeleted($event)"
  (coverSet)="onCoverSet($event)">
</app-product-image-editor>
