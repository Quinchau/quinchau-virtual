<div class="space-y-4">
  <!-- Botón único para agregar imagen -->
  <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
    <input type="file" 
           #fileInput 
           accept="image/jpeg,image/png,image/jpg,image/webp"
           (change)="onFileSelected($event)" 
           class="hidden">
    <button type="button" 
            (click)="fileInput.click()" 
            class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition-colors flex items-center justify-center gap-2 mx-auto">
      <span class="text-xl">📷</span>
      Agregar imagen
    </button>
    <p class="text-sm text-gray-500 mt-2">
      Formatos: JPEG, PNG, JPG, WEBP (Max 5MB)
    </p>  
  </div>

  <!-- Lista de imágenes -->
  <div *ngIf="images.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    <div *ngFor="let image of images" class="border rounded-lg overflow-hidden shadow-sm relative group">
      <div class="relative bg-gray-100">
        <img [src]="image.url" class="w-full h-32 object-cover">
        
        <span *ngIf="image.cover" class="absolute top-2 left-2 bg-yellow-500 text-white text-xs px-2 py-1 rounded-full">
          ★ Principal
        </span>
        
        <div *ngIf="image.status === 'uploading'" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
          <div class="text-white text-sm">Subiendo...</div>
        </div>
        
        <div *ngIf="image.status === 'error'" class="absolute inset-0 bg-red-500 bg-opacity-75 flex items-center justify-center">
          <button (click)="retryUpload(image)" class="text-white text-sm bg-red-700 px-3 py-1 rounded">
            Reintentar
          </button>
        </div>
      </div>
      
      <div class="p-2 flex gap-1 justify-center flex-wrap">
        <button *ngIf="!image.cover && image.id" 
                (click)="setPrimary(image.id!)" 
                class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded hover:bg-yellow-200">
          ★ Principal
        </button>
        <!-- ✅ Botón EDITAR - NUEVO -->
        <button *ngIf="image.id && stockId && stockId !== 'temp'" 
                type="button"
                (click)="openEditor($event, image.id!)" 
                class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
          ✏️ Editar
        </button>
        <button *ngIf="image.id" 
                (click)="deleteImage(image.id!)" 
                class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">
          🗑 Eliminar
        </button>
      </div>
    </div>
  </div>
  
  <!-- Mensaje cuando no hay imágenes -->
  <div *ngIf="images.length === 0" class="text-center py-4 text-gray-400 text-sm">
    No hay imágenes
  </div>
  
  <!-- Contador -->
  <div *ngIf="images.length > 0" class="text-sm text-gray-500 text-center">
    Total: {{ images.length }} imagen(es)
  </div>
</div>

<!-- ✅ Modal del editor de imágenes -->
<app-product-image-editor
  *ngIf="editorVisible"
  [stockId]="stockId"
  [imageId]="selectedImageId"
  [imageUrl]="selectedImageUrl"
  (close)="closeEditor()"
  (imageSaved)="onImageSaved($event)">
</app-product-image-editor>
