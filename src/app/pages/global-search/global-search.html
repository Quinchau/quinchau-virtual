<!-- src/app/pages/global-search/global-search.html -->

<!-- Bottom sheet con el buscador -->
@if (isOpen()) {
  <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm" (click)="closeSearch()">
    <div class="absolute bottom-0 left-0 right-0 h-[85vh] bg-white rounded-t-2xl shadow-xl flex flex-col" 
         (click)="$event.stopPropagation()">
      
      <!-- Header -->
      <div class="flex items-center justify-between p-4 border-b shrink-0">
        <h3 class="text-lg font-bold">Buscar Productos</h3>
        <button (click)="closeSearch()" class="p-2 rounded-full hover:bg-gray-100">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      
      <!-- Product Picker -->
      <div class="flex-1 overflow-y-auto">
        <app-product-picker (productSelected)="onProductSelected($event)" />
      </div>
    </div>
  </div>
}

@if (selectedProductId(); as id) {
  <div class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-zinc-950/40 backdrop-blur-md p-0 sm:p-6 animate-in fade-in duration-500"
       (click)="closeProductDetail()">
    <div class="relative w-full max-w-3xl animate-in slide-in-from-bottom-20 duration-700 ease-out"
         (click)="$event.stopPropagation()">
      <button (click)="closeProductDetail()"
              class="absolute -top-16 right-6 sm:-right-4 sm:-top-12 text-white flex items-center gap-2 font-inter font-black uppercase text-[11px] tracking-[0.3em] hover:text-orange-400 transition-colors">
        ESC
        <span class="material-symbols-outlined text-2xl font-light">close</span>
      </button>
      <div class="bg-white rounded-t-[3.5rem] sm:rounded-[3.5rem] shadow-[0_30px_100px_rgba(0,0,0,0.2)] overflow-hidden">
  <app-product-order 
    [productId]="id"
    [embeddedMode]="true"
    (closed)="closeProductDetail()" />
</div>
    </div>
  </div>
}
