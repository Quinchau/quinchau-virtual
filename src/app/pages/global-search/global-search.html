<!-- src/app/pages/global-search/global-search.html -->

<!-- Bottom sheet con el buscador -->
@if (isOpen()) {
  <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm" (click)="closeSearch()">
    <div class="absolute bottom-0 left-0 right-0 h-[85vh] bg-white rounded-t-2xl shadow-xl flex flex-col" 
         (click)="$event.stopPropagation()">
      
      <!-- Header -->
      <div class="flex items-center justify-between p-4 border-b shrink-0">
        <h3 class="text-lg font-bold">Buscar Productos</h3>
        <button (click)="closeSearch()" class="p-2 rounded-full hover:bg-gray-100">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      
      <!-- Product Picker -->
      <div class="flex-1 overflow-y-auto">
        <app-product-picker (productSelected)="onProductSelected($event)" />
      </div>
    </div>
  </div>
}
