<div class="p-2 transition-all">
  <div class="flex flex-col gap-3">
    
    <div class="relative w-full group">
      @if (managerState.productSearchTerm()) {
        <button
          (click)="clearSearch()"
          class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-orange-500 p-2 transition-all focus:outline-none z-10 animate-in fade-in zoom-in duration-200"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
      }

      <input
        type="text"
        placeholder="Buscar productos..."
        [(ngModel)]="localQuery"
        (keyup.enter)="onSearch()"
        [class.pl-12]="managerState.productSearchTerm()"
        class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all pr-12 shadow-sm"
      >
      
      <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center">
        <button
          (click)="onSearch()"
          [disabled]="!localQuery()"
          class="p-2 rounded-md transition-all focus:outline-none"
          [ngClass]="localQuery() ? 'text-orange-500 hover:bg-orange-50' : 'text-gray-300'"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
      </div>
    </div>

    @if (managerState.productSearchTerm()) {
      <div class="flex items-center gap-2 animate-in fade-in slide-in-from-top-1 duration-200">
        <button
          (click)="managerState.toggleProductStock(!managerState.productIncludeStock())"
          [ngClass]="managerState.productIncludeStock() 
            ? 'bg-orange-500 text-white border-transparent' 
            : 'bg-white text-slate-500 border-slate-200 hover:border-orange-200'"
          class="flex items-center gap-2 px-3 py-1 rounded-full border text-[10px] font-bold transition-all shadow-sm"
        >
          <span class="relative flex h-2 w-2">
            @if (managerState.productIncludeStock()) {
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
            }
            <span class="relative inline-flex rounded-full h-2 w-2" [ngClass]="managerState.productIncludeStock() ? 'bg-white' : 'bg-slate-300'"></span>
          </span>
          {{ managerState.productIncludeStock() ? 'VIENDO SOLO DISPONIBLES' : 'MOSTRAR SOLO DISPONIBLES' }}
        </button>
      </div>
    }
  </div>
</div>
